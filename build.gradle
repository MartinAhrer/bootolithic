import org.jmolecules.bytebuddy.JMoleculesPlugin

buildscript {
    // TODO try moving to jmolecules conventions
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath(platform("org.jmolecules:jmolecules-bom:${libs.versions.jmolecules.get()}"))
        classpath("org.jmolecules.integrations:jmolecules-bytebuddy")
    }
}

plugins {
    id 'java'

    id 'java-conventions'
    id 'dependency-conventions'
    id 'test-conventions'
    id 'build-conventions'

    alias(libs.plugins.graalvm.buildtools.native)
    alias(libs.plugins.spring.boot)

    alias(libs.plugins.cyclonedx.bom)

    alias(libs.plugins.byte.buddy)
}

group = 'at.martinahrer.bootolithic'
version = '0.0.1-SNAPSHOT'
description = 'bootolithic'

repositories {
    maven {
        url = 'https://repo.spring.io/snapshot'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Maven Central SnapShots"
        url = "https://central.sonatype.com/repository/maven-snapshots/"
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {

    annotationProcessor(libs.jilt)
    annotationProcessor(libs.mapstruct.processor)

    annotationProcessor(platform(libs.spring.boot.dependencies))
    annotationProcessor(libs.spring.boot.configuration.processor)
    annotationProcessor(libs.lombok)
    annotationProcessor(libs.lombok.mapstruct.binding)

    implementation(platform(libs.spring.boot.dependencies))
    implementation(platform(libs.spring.modulith.bom))
    implementation(libs.flyway.database.postgresql)
    implementation(libs.hibernate.core)
    implementation(libs.hypersistence.utils.hibernate)
    implementation(libs.hypersistence.tsid)
    runtimeOnly(libs.jackson.datatype.moneta) // runtimeOnly fixes :"java.util.zip.ZipException: zip END header not found"
    implementation(libs.jakarta.persistence.api)
    implementation(libs.jilt)
    implementation(platform(libs.jmolecules.bom))
    implementation(libs.jmolecules.bytebuddy.nodep)
    implementation(libs.jmolecules.ddd)
    implementation(libs.jmolecules.ddd.integration)
    implementation(libs.jmolecules.jackson3)
    implementation(libs.jmolecules.jpa)
    implementation(libs.jmolecules.spring)
    implementation(libs.jmolecules.starter.ddd)

    implementation(libs.mapstruct)
    implementation(libs.moneta)
    implementation(libs.money.api)
    implementation(libs.spring.boot.hibernate)
    implementation(libs.spring.boot.starter.actuator)
    implementation(libs.spring.boot.starter.data.jpa)
    implementation(libs.spring.boot.starter.flyway)
    implementation(libs.spring.boot.starter.opentelemetry)
    implementation(libs.spring.boot.starter.security)
    implementation(libs.spring.boot.starter.security.oauth2.client)
    implementation(libs.spring.boot.starter.security.oauth2.resource.server)
    implementation(libs.spring.boot.starter.validation)
    implementation(libs.spring.boot.starter.webflux)
    implementation(libs.spring.boot.starter.webmvc)
    implementation(libs.spring.context)
    implementation(libs.spring.data.commons)
    implementation(libs.spring.hateoas)
    implementation(libs.spring.hateoas.jsonapi)
    implementation(libs.spring.modulith.starter.core)
    implementation(libs.spring.modulith.starter.jpa)
    implementation(libs.spring.modulith.api)
    implementation(libs.spring.modulith.core)
    implementation(libs.spring.modulith.docs)
    implementation(libs.spring.modulith.runtime)

    compileOnly(libs.jilt)
    compileOnly(platform(libs.spring.boot.dependencies))

    developmentOnly(platform(libs.spring.boot.dependencies))
    developmentOnly(libs.spring.boot.devtools)
    developmentOnly(libs.spring.boot.docker.compose)

    runtimeOnly(platform(libs.spring.boot.dependencies))
    runtimeOnly(libs.postgresql)
    runtimeOnly(libs.spring.modulith.actuator)
    runtimeOnly(libs.spring.modulith.observability)
    runtimeOnly(platform(libs.jmolecules.bom))
    runtimeOnly(libs.jmolecules.jackson3)

    testImplementation(libs.commons.lang3)
    testImplementation(libs.spring.boot.dependencies)
    testImplementation(libs.spring.boot.test)
    testImplementation(libs.spring.test)

    testRuntimeOnly(platform(libs.spring.boot.dependencies))

    testFixturesImplementation(platform(libs.jmolecules.bom))
    testFixturesImplementation(platform(libs.spring.boot.dependencies))
    testFixturesImplementation(platform(libs.spring.modulith.bom))
    testFixturesImplementation(libs.jmolecules.ddd)
    testFixturesImplementation(libs.money.api)
    testFixturesImplementation(libs.moneta)
    testFixturesImplementation(libs.spring.modulith.api)
    testFixturesImplementation(libs.spring.beans)
    testFixturesImplementation(libs.spring.context)

    integrationTestImplementation(libs.hypersistence.tsid)
    integrationTestImplementation(platform(libs.jmolecules.bom))
    //integrationTestImplementation(libs.jmolecules.ddd) // TODO shouldn't this be inherited from production
    //integrationTestImplementation(libs.jmolecules.ddd.integration) //TODO shouldn't this be inherited from production
    //integrationTestImplementation(libs.moneta)
    //integrationTestImplementation(libs.spring.modulith.runtime)
    integrationTestImplementation(libs.spock.spring)
    integrationTestImplementation(libs.spring.boot.jdbc.test)
    //integrationTestImplementation(libs.spring.boot.starter.flyway)
    //integrationTestImplementation(libs.spring.boot.starter.security.test)
    //integrationTestImplementation(libs.spring.boot.starter.webflux.test)
    //integrationTestImplementation(libs.testcontainers.keycloak)
    integrationTestImplementation(libs.hypersistence.tsid)
}

// required for jMolecules
byteBuddy {
    // TODO try moving to jmolecules conventions
    transformation {
        plugin = JMoleculesPlugin
    }
}

springBoot {
    buildInfo()
}
